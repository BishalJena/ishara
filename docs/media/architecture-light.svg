<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="560" viewBox="0 0 1380 560" role="img">
<title>Ishara architecture: the app, the Ishara backend, Bolna and the clinic's phone</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.h{font-size:17px;font-weight:600;fill:#1F2328}.d{font-size:13.5px;fill:#59636E}.title{font-size:22px;font-weight:700;fill:#1F2328}.sub{font-size:13px;fill:#59636E}.lab{font-size:12.5px;font-weight:600;fill:#59636E}@keyframes fill{0%,8%{transform:scaleX(0)}30%{transform:scaleX(1)}34%,100%{transform:scaleX(1);opacity:0}}.bar{transform-box:fill-box;transform-origin:left;animation:fill 3.0s linear infinite}@keyframes talk{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}.w{transform-box:fill-box;transform-origin:center;animation:talk 1.1s ease-in-out infinite}@keyframes o0{0%,0.00%{transform:translateX(360px);opacity:0}0.60%{opacity:1}9.40%{opacity:1}10.00%,100%{transform:translateX(456px);opacity:0}}.o0{animation:o0 9s cubic-bezier(.45,0,.25,1) infinite}@keyframes o1{0%,17.78%{transform:translateX(840px);opacity:0}18.38%{opacity:1}27.18%{opacity:1}27.78%,100%{transform:translateX(936px);opacity:0}}.o1{animation:o1 9s cubic-bezier(.45,0,.25,1) infinite}@keyframes o2{0%,33.33%{transform:translateX(1200px);opacity:0}33.93%{opacity:1}41.62%{opacity:1}42.22%,100%{transform:translateX(1276px);opacity:0}}.o2{animation:o2 9s cubic-bezier(.45,0,.25,1) infinite}@keyframes b0{0%,51.11%{transform:translateX(1276px);opacity:0}51.71%{opacity:1}59.40%{opacity:1}60.00%,100%{transform:translateX(1200px);opacity:0}}.b0{animation:b0 9s cubic-bezier(.45,0,.25,1) infinite}@keyframes b1{0%,64.44%{transform:translateX(936px);opacity:0}65.04%{opacity:1}73.84%{opacity:1}74.44%,100%{transform:translateX(840px);opacity:0}}.b1{animation:b1 9s cubic-bezier(.45,0,.25,1) infinite}@keyframes b2{0%,80.00%{transform:translateX(456px);opacity:0}80.60%{opacity:1}89.40%{opacity:1}90.00%,100%{transform:translateX(360px);opacity:0}}.b2{animation:b2 9s cubic-bezier(.45,0,.25,1) infinite}</style>
<text class="lab" x="415.0" y="213" text-anchor="middle">WebSocket</text>
<line x1="360" y1="235" x2="470" y2="235" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
<line x1="360" y1="395" x2="470" y2="395" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
<text class="lab" x="895.0" y="213" text-anchor="middle">custom LLM</text>
<line x1="840" y1="235" x2="950" y2="235" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
<line x1="840" y1="395" x2="950" y2="395" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
<text class="lab" x="1245.0" y="213" text-anchor="middle">phone call</text>
<line x1="1200" y1="235" x2="1290" y2="235" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
<line x1="1200" y1="395" x2="1290" y2="395" stroke="#D0D7DE" stroke-width="3" stroke-linecap="round"/>
<text class="lab" x="415.0" y="425" text-anchor="middle">captions</text>
<text class="lab" x="895.0" y="425" text-anchor="middle">transcript</text>
<text class="lab" x="1245.0" y="425" text-anchor="middle">their voice</text>
<rect x="30" y="60" width="330" height="440" rx="22" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="title" x="54" y="102">Ishara app</text>
<text class="sub" x="54" y="124">iPhone · SwiftUI</text>
<circle cx="60" cy="167.0" r="4" fill="#8B3DFF"/>
<text class="h" x="74" y="172.0">Your request, typed</text>
<text class="d" x="74" y="193.0">plus photos or PDFs, read on the phone</text>
<circle cx="60" cy="249.5" r="4" fill="#8B3DFF"/>
<text class="h" x="74" y="254.5">Both sides, captioned</text>
<text class="d" x="74" y="275.5">times and dates pulled out as you read</text>
<circle cx="60" cy="332.0" r="4" fill="#8B3DFF"/>
<text class="h" x="74" y="337.0">Ishara's next line</text>
<text class="d" x="74" y="358.0">2 s to change it, or it is said</text>
<rect x="74" y="369.0" width="200" height="6" rx="3" fill="#E7E9EC"/>
<rect class="bar" x="74" y="369.0" width="200" height="6" rx="3" fill="#8B3DFF"/>
<circle cx="60" cy="414.5" r="4" fill="#8B3DFF"/>
<text class="h" x="74" y="419.5">Step in: type or sign</text>
<text class="d" x="74" y="440.5">MediaPipe + ASL model, on device</text>
<rect x="470" y="60" width="370" height="440" rx="22" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="title" x="494" y="102">Ishara backend</text>
<text class="sub" x="494" y="124">FastAPI on Heroku</text>
<circle cx="500" cy="167.0" r="4" fill="#8B3DFF"/>
<text class="h" x="514" y="172.0">Opens with your request</text>
<text class="d" x="514" y="193.0">reworded, never read out raw</text>
<circle cx="500" cy="249.5" r="4" fill="#8B3DFF"/>
<text class="h" x="514" y="254.5">Decides every turn</text>
<text class="d" x="514" y="275.5">accept, answer from your files, or defer</text>
<circle cx="500" cy="332.0" r="4" fill="#8B3DFF"/>
<text class="h" x="514" y="337.0">Polishes your words</text>
<text class="d" x="514" y="358.0">Groq · gpt-oss-120b</text>
<circle cx="500" cy="414.5" r="4" fill="#8B3DFF"/>
<text class="h" x="514" y="419.5">Fact-checker</text>
<text class="d" x="514" y="440.5">no invented day, time, number or name</text>
<rect x="950" y="60" width="250" height="440" rx="22" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="title" x="974" y="102">Bolna</text>
<text class="sub" x="974" y="124">voice agent · custom LLM</text>
<circle cx="980" cy="167.0" r="4" fill="#8B3DFF"/>
<text class="h" x="994" y="172.0">Deepgram</text>
<text class="d" x="994" y="193.0">listens</text>
<circle cx="980" cy="277.0" r="4" fill="#8B3DFF"/>
<text class="h" x="994" y="282.0">Sarvam Bulbul</text>
<text class="d" x="994" y="303.0">speaks</text>
<circle cx="980" cy="387.0" r="4" fill="#8B3DFF"/>
<text class="h" x="994" y="392.0">Plivo</text>
<text class="d" x="994" y="413.0">connects the line</text>
<rect x="1290" y="190" width="70" height="250" rx="18" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<rect class="w" style="animation-delay:0.00s" x="1307" y="266.0" width="6" height="18" rx="3" fill="#8B3DFF"/>
<rect class="w" style="animation-delay:0.15s" x="1317" y="260.0" width="6" height="30" rx="3" fill="#8B3DFF"/>
<rect class="w" style="animation-delay:0.30s" x="1327" y="263.0" width="6" height="24" rx="3" fill="#8B3DFF"/>
<rect class="w" style="animation-delay:0.45s" x="1337" y="268.0" width="6" height="14" rx="3" fill="#8B3DFF"/>
<text class="h" x="1325.0" y="335" text-anchor="middle">Clinic</text>
<text class="d" x="1325.0" y="357" text-anchor="middle">any phone</text>
<text class="d" x="1325.0" y="375" text-anchor="middle">no app</text>
<circle class="o0" cx="7" cy="235" r="7" fill="#8B3DFF"/>
<circle class="o1" cx="7" cy="235" r="7" fill="#8B3DFF"/>
<circle class="o2" cx="7" cy="235" r="7" fill="#8B3DFF"/>
<circle class="b0" cx="7" cy="395" r="7" fill="#1A7F37"/>
<circle class="b1" cx="7" cy="395" r="7" fill="#1A7F37"/>
<circle class="b2" cx="7" cy="395" r="7" fill="#1A7F37"/>
