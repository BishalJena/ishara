<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img">
<title>One turn of an Ishara call travels a loop: the clinic's words reach the app through Deepgram and the Ishara backend; the user's words reach the clinic through Groq, the fact-checker and Sarvam</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.t1{font-size:19px;font-weight:700;fill:#17141F}.t2{font-size:15px;font-weight:650;fill:#17141F}.s{font-size:13px;fill:#6B6680}.eye{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#6B6680}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 1.6s cubic-bezier(.77,0,.175,1) infinite}@media (prefers-reduced-motion:reduce){.mv{display:none}.breathe{animation:none}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F3FF"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#E4DEF3"/></pattern>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B07BFF"/><stop offset=".55" stop-color="#8B3DFF"/><stop offset="1" stop-color="#5B16D6"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B1A66" flood-opacity="0.10"/></filter>
<radialGradient id="halo"><stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="1398" height="698" rx="28" fill="url(#bg)" stroke="#E7E2F5"/>
<rect x="1" y="1" width="1398" height="698" rx="28" fill="url(#dots)"/>
<text class="eye" x="44" y="54">ONE TURN OF A CALL</text>
<path d="M 1100 350.0 A 180.0 180.0 0 0 0 920.0 170 H 480.0 A 180.0 180.0 0 0 0 480.0 530 H 920.0 A 180.0 180.0 0 0 0 1100 350.0 Z" fill="none" stroke="#ECE8F6" stroke-width="14"/>
<path d="M 1100 350.0 A 180.0 180.0 0 0 0 920.0 170 H 480.0 A 180.0 180.0 0 0 0 480.0 530 H 920.0 A 180.0 180.0 0 0 0 1100 350.0 Z" fill="none" stroke="#E6E1F2" stroke-width="1.5" stroke-dasharray="1 9" stroke-linecap="round"/>
<circle class="mv" cx="860" cy="170" r="34" fill="#16A34A" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="spline" values="0;0;0.28;0;0" keyTimes="0;0.160;0.175;0.230;1" keySplines="0 0 1 1;0.23 1 0.32 1;0.4 0 0.2 1;0 0 1 1"/></circle>
<circle cx="860" cy="170" r="26" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5" filter="url(#sh)"/>
<g transform="translate(848.0 158.0) scale(1.000)" fill="none" stroke="#16A34A" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v4"/></g>
<text class="t2" x="860" y="118" text-anchor="middle">Deepgram</text><text class="s" x="860" y="136" text-anchor="middle">transcribes them</text>
<circle class="mv" cx="620" cy="170" r="34" fill="#16A34A" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="spline" values="0;0;0.28;0;0" keyTimes="0;0.280;0.295;0.350;1" keySplines="0 0 1 1;0.23 1 0.32 1;0.4 0 0.2 1;0 0 1 1"/></circle>
<circle cx="620" cy="170" r="26" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5" filter="url(#sh)"/>
<g transform="translate(608.0 158.0) scale(1.000)" fill="none" stroke="#16A34A" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8.5 6h2a5 5 0 0 1 5 5M8.5 18h2a5 5 0 0 0 5-5"/></g>
<text class="t2" x="620" y="118" text-anchor="middle">Ishara decides</text><text class="s" x="620" y="136" text-anchor="middle">accept, answer, defer</text>
<circle class="mv" cx="560" cy="530" r="34" fill="#7C3AED" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="spline" values="0;0;0.28;0;0" keyTimes="0;0.670;0.685;0.740;1" keySplines="0 0 1 1;0.23 1 0.32 1;0.4 0 0.2 1;0 0 1 1"/></circle>
<circle cx="560" cy="530" r="26" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5" filter="url(#sh)"/>
<g transform="translate(548.0 518.0) scale(1.000)" fill="none" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></g>
<text class="t2" x="560" y="582" text-anchor="middle">Groq polishes</text><text class="s" x="560" y="600" text-anchor="middle">your words, no new facts</text>
<circle class="mv" cx="720" cy="530" r="34" fill="#7C3AED" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="spline" values="0;0;0.28;0;0" keyTimes="0;0.750;0.765;0.820;1" keySplines="0 0 1 1;0.23 1 0.32 1;0.4 0 0.2 1;0 0 1 1"/></circle>
<circle cx="720" cy="530" r="26" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5" filter="url(#sh)"/>
<g transform="translate(708.0 518.0) scale(1.000)" fill="none" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.5-7.5 9.5-4.3-1-7.5-4.9-7.5-9.5V6z"/><path d="M8.7 12.2l2.3 2.3 4.4-4.6"/></g>
<text class="t2" x="720" y="582" text-anchor="middle">Fact-checker</text><text class="s" x="720" y="600" text-anchor="middle">blocks invented facts</text>
<circle class="mv" cx="880" cy="530" r="34" fill="#7C3AED" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="spline" values="0;0;0.28;0;0" keyTimes="0;0.830;0.845;0.900;1" keySplines="0 0 1 1;0.23 1 0.32 1;0.4 0 0.2 1;0 0 1 1"/></circle>
<circle cx="880" cy="530" r="26" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5" filter="url(#sh)"/>
<g transform="translate(868.0 518.0) scale(1.000)" fill="none" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6.5 9H3.5v6h3L11 19z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6a8.5 8.5 0 0 1 0 12"/></g>
<text class="t2" x="880" y="582" text-anchor="middle">Sarvam speaks</text><text class="s" x="880" y="600" text-anchor="middle">your line, over Plivo</text>
<rect x="252" y="302.0" width="96" height="96" rx="26" fill="#FFFFFF" stroke="#E6E1F2" filter="url(#sh)"/>
<rect class="mv" x="252" y="302.0" width="96" height="96" rx="26" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="spline" values="0;0;1.0;0;0" keyTimes="0;0.490;0.505;0.580;1" keySplines="0 0 1 1;0.23 1 0.32 1;0.4 0 0.2 1;0 0 1 1"/></rect>
<g transform="translate(282.0 320.0) scale(1.500)" fill="none" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g>
<text class="t2" x="300" y="376.0" text-anchor="middle">Ishara app</text><text class="s" x="300" y="416.0" text-anchor="middle">2 s to step in</text>
<rect x="1052" y="302.0" width="96" height="96" rx="26" fill="#FFFFFF" stroke="#E6E1F2" filter="url(#sh)"/>
<rect class="mv" x="1052" y="302.0" width="96" height="96" rx="26" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="spline" values="1.0;0;0;1.0" keyTimes="0;0.07;0.96;1" keySplines="0.4 0 0.2 1;0 0 1 1;0.23 1 0.32 1"/></rect>
<g transform="translate(1082.0 320.0) scale(1.500)" fill="none" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.5 4.2-2 1.3a11 11 0 0 0 6 6l1.3-2 4.2 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/></g>
<text class="t2" x="1100" y="376.0" text-anchor="middle">Clinic</text><text class="s" x="1100" y="416.0" text-anchor="middle">any phone</text>
<circle cx="700" cy="322.0" r="91.19999999999999" fill="url(#halo)"/>
<rect x="652.0" y="274.0" width="96" height="96" rx="25.92" fill="url(#mark)" filter="url(#sh)"/>
<rect class="breathe" style="animation-delay:0.0s" x="670.7" y="299.9" width="9.6" height="44.2" rx="4.8" fill="#fff"/>
<rect class="breathe" style="animation-delay:0.2s" x="687.0" y="288.4" width="9.6" height="67.2" rx="4.8" fill="#fff"/>
<rect class="breathe" style="animation-delay:0.4s" x="703.4" y="292.2" width="9.6" height="59.5" rx="4.8" fill="#fff"/>
<rect class="breathe" style="animation-delay:0.6s" x="719.7" y="303.8" width="9.6" height="36.5" rx="4.8" fill="#fff"/>
<text class="t1" x="700" y="402.0" text-anchor="middle">Their words reach your screen.</text>
<text class="t1" x="700" y="428.0" text-anchor="middle" style="fill:#7C3AED">Yours reach their phone.</text>
<circle class="mv" r="18" fill="url(#halo)"><animateMotion dur="10s" repeatCount="indefinite" path="M 1100 350.0 A 180.0 180.0 0 0 0 920.0 170 H 480.0 A 180.0 180.0 0 0 0 480.0 530 H 920.0 A 180.0 180.0 0 0 0 1100 350.0 Z"/></circle>
<circle class="mv" r="8" fill="#16A34A"><animateMotion dur="10s" repeatCount="indefinite" path="M 1100 350.0 A 180.0 180.0 0 0 0 920.0 170 H 480.0 A 180.0 180.0 0 0 0 480.0 530 H 920.0 A 180.0 180.0 0 0 0 1100 350.0 Z"/><animate attributeName="fill" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#16A34A;#7C3AED" keyTimes="0;0.5"/></circle>
<text class="s" x="700" y="660" text-anchor="middle">Ishara backend: FastAPI on Heroku · Bolna runs the call: Deepgram, Sarvam, Plivo · the app: SwiftUI, MediaPipe, the ASL model on device</text>
</svg>
