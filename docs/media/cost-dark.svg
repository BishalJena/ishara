<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img">
<title>One 10-minute call: $40.70 to $80.60 with a human relay, $0.60 with an AI voice agent</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.zone{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#9198A1}.title{font-size:24px;font-weight:700;fill:#E6EDF3}.sub{font-size:14px;fill:#9198A1}.row{font-size:16px;fill:#E6EDF3}.chip{font-size:12.5px;font-weight:600;fill:#9198A1}.lab{font-size:12.5px;font-weight:700;fill:#9198A1}@keyframes grow{0%{transform:scaleY(0)}14%{transform:scaleY(1)}94%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}.g1{transform-box:fill-box;transform-origin:bottom;animation:grow 10.0s cubic-bezier(.2,.8,.2,1) infinite}@keyframes grow2{0%,12%{transform:scaleY(0)}26%{transform:scaleY(1)}94%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}.g2{transform-box:fill-box;transform-origin:bottom;animation:grow2 10.0s cubic-bezier(.2,.8,.2,1) infinite}@keyframes show{0%,28%{opacity:0}34%,94%{opacity:1}100%{opacity:0}}.show{animation:show 10.0s ease-out infinite}.big{font-size:150px;font-weight:800;fill:#A371F7;letter-spacing:-6px}.val{font-size:22px;font-weight:700;fill:#E6EDF3}.axis{font-size:14px;fill:#9198A1}.h2{font-size:28px;font-weight:700;fill:#E6EDF3}</style>
