<text class="axis" x="118" y="337.0" text-anchor="end">$40</text>
<line x1="130" y1="248.0" x2="820" y2="248.0" stroke="#E6E1F2" stroke-width="1"/>
<text class="axis" x="118" y="253.0" text-anchor="end">$60</text>
<line x1="130" y1="164.0" x2="820" y2="164.0" stroke="#E6E1F2" stroke-width="1"/>
<text class="axis" x="118" y="169.0" text-anchor="end">$80</text>
<rect class="g1" x="260" y="329.05999999999995" width="170" height="170.94000000000003" rx="8" fill="#7C3AED"/>
<rect class="g2" x="260" y="161.47999999999996" width="170" height="167.57999999999998" rx="8" fill="#7C3AED" fill-opacity=".35"/>
<rect class="g1" x="600" y="496" width="170" height="4" rx="2" fill="#7C3AED"/>
<text class="val show" x="345.0" y="147.47999999999996" text-anchor="middle">$40.70–$80.60</text>
<text class="val show" x="685.0" y="480" text-anchor="middle" style="fill:#7C3AED">$0.60</text>
