<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img">
<title>One 10-minute call: $40.70 to $80.60 through a human video relay, $0.60 through an AI voice agent; up to 99% less, every minute</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.t1{font-size:19px;font-weight:700;fill:#17141F}.t2{font-size:15px;font-weight:650;fill:#17141F}.s{font-size:13px;fill:#6B6680}.eye{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#6B6680}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 1.6s cubic-bezier(.77,0,.175,1) infinite}@keyframes grow{0%{transform:scaleY(0.02)}14%{transform:scaleY(1)}94%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}.g1{transform-box:fill-box;transform-origin:bottom;animation:grow 10.0s cubic-bezier(.23,1,.32,1) infinite}@keyframes grow2{0%,12%{transform:scaleY(0.02)}26%{transform:scaleY(1)}94%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}.g2{transform-box:fill-box;transform-origin:bottom;animation:grow2 10.0s cubic-bezier(.23,1,.32,1) infinite}@keyframes show{0%,28%{opacity:0}34%,94%{opacity:1}100%{opacity:0}}.show{animation:show 10.0s cubic-bezier(.23,1,.32,1) infinite}.big{font-size:150px;font-weight:800;fill:#7C3AED;letter-spacing:-6px}.val{font-size:22px;font-weight:700;fill:#17141F}.axis{font-size:14px;fill:#6B6680}.h2{font-size:28px;font-weight:700;fill:#17141F}@media (prefers-reduced-motion:reduce){.g1,.g2,.show{animation:none;opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.mv{display:none}.breathe{animation:none}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F3FF"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#E4DEF3"/></pattern>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B07BFF"/><stop offset=".55" stop-color="#8B3DFF"/><stop offset="1" stop-color="#5B16D6"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B1A66" flood-opacity="0.10"/></filter>
<radialGradient id="halo"><stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="1398" height="618" rx="28" fill="url(#bg)" stroke="#E7E2F5"/>
<rect x="1" y="1" width="1398" height="618" rx="28" fill="url(#dots)"/>
