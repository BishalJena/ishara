<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img">
<title>One Ishara call in six steps: type the request, Ishara calls, read every word, Ishara handles it, step in any time, the gist</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.t1{font-size:19px;font-weight:700;fill:#17141F}.t2{font-size:15px;font-weight:650;fill:#17141F}.s{font-size:13px;fill:#6B6680}.eye{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#6B6680}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 1.6s cubic-bezier(.77,0,.175,1) infinite}@keyframes prog{0%{transform:scaleX(0)}69.2%{transform:scaleX(1)}92%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.prog{transform-box:fill-box;transform-origin:left;animation:prog 13.0s linear infinite}.st{font-size:20px;font-weight:700;fill:#17141F}.sd{font-size:14.5px;fill:#6B6680}.num{font-size:17px;font-weight:700}@keyframes on0{0%,0.00%{opacity:0}2.00%,92%{opacity:1}100%{opacity:0}}.on0{animation:on0 13.0s cubic-bezier(.23,1,.32,1) infinite}@keyframes on1{0%,13.75%{opacity:0}15.85%,92%{opacity:1}100%{opacity:0}}.on1{animation:on1 13.0s cubic-bezier(.23,1,.32,1) infinite}@keyframes on2{0%,27.59%{opacity:0}29.69%,92%{opacity:1}100%{opacity:0}}.on2{animation:on2 13.0s cubic-bezier(.23,1,.32,1) infinite}@keyframes on3{0%,41.44%{opacity:0}43.54%,92%{opacity:1}100%{opacity:0}}.on3{animation:on3 13.0s cubic-bezier(.23,1,.32,1) infinite}@keyframes on4{0%,55.28%{opacity:0}57.38%,92%{opacity:1}100%{opacity:0}}.on4{animation:on4 13.0s cubic-bezier(.23,1,.32,1) infinite}@keyframes on5{0%,69.13%{opacity:0}71.23%,92%{opacity:1}100%{opacity:0}}.on5{animation:on5 13.0s cubic-bezier(.23,1,.32,1) infinite}@media (prefers-reduced-motion:reduce){.prog,.on0,.on1,.on2,.on3,.on4,.on5{animation:none;opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.mv{display:none}.breathe{animation:none}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F3FF"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#E4DEF3"/></pattern>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B07BFF"/><stop offset=".55" stop-color="#8B3DFF"/><stop offset="1" stop-color="#5B16D6"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B1A66" flood-opacity="0.10"/></filter>
<radialGradient id="halo"><stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="1398" height="338" rx="28" fill="url(#bg)" stroke="#E7E2F5"/>
<rect x="1" y="1" width="1398" height="338" rx="28" fill="url(#dots)"/>
<text class="eye" x="44" y="54">ONE CALL, YOUR WAY</text>
<line x1="160" y1="120" x2="1240" y2="120" stroke="#ECE8F6" stroke-width="6" stroke-linecap="round"/>
<rect class="prog" x="160" y="117" width="1080" height="6" rx="3" fill="#7C3AED"/>
<rect x="62.0" y="160" width="196" height="136" rx="18" fill="#FFFFFF" stroke="#E6E1F2" filter="url(#sh)"/>
<rect class="on0" x="62.0" y="160" width="196" height="136" rx="18" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2" opacity="0"/>
<circle cx="160.0" cy="120" r="20" fill="#FFFFFF" stroke="#E6E1F2" stroke-width="2"/>
<circle class="on0" cx="160.0" cy="120" r="20" fill="#7C3AED" opacity="0"/>
<text class="num" x="160.0" y="126" text-anchor="middle" fill="#6B6680">1</text>
<text class="num on0" x="160.0" y="126" text-anchor="middle" fill="#FFFFFF" opacity="0">1</text>
<text class="st" x="160.0" y="200" text-anchor="middle">Type the request</text>
<text class="sd" x="160.0" y="230" text-anchor="middle">The number, what it's about,</text>
<text class="sd" x="160.0" y="251" text-anchor="middle">and a PDF they might need</text>
<rect x="278.0" y="160" width="196" height="136" rx="18" fill="#FFFFFF" stroke="#E6E1F2" filter="url(#sh)"/>
<rect class="on1" x="278.0" y="160" width="196" height="136" rx="18" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2" opacity="0"/>
<circle cx="376.0" cy="120" r="20" fill="#FFFFFF" stroke="#E6E1F2" stroke-width="2"/>
<circle class="on1" cx="376.0" cy="120" r="20" fill="#7C3AED" opacity="0"/>
<text class="num" x="376.0" y="126" text-anchor="middle" fill="#6B6680">2</text>
<text class="num on1" x="376.0" y="126" text-anchor="middle" fill="#FFFFFF" opacity="0">2</text>
<text class="st" x="376.0" y="200" text-anchor="middle">Ishara calls</text>
<text class="sd" x="376.0" y="230" text-anchor="middle">It says who it is, then</text>
<text class="sd" x="376.0" y="251" text-anchor="middle">asks in its own words</text>
<rect x="494.0" y="160" width="196" height="136" rx="18" fill="#FFFFFF" stroke="#E6E1F2" filter="url(#sh)"/>
<rect class="on2" x="494.0" y="160" width="196" height="136" rx="18" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2" opacity="0"/>
<circle cx="592.0" cy="120" r="20" fill="#FFFFFF" stroke="#E6E1F2" stroke-width="2"/>
<circle class="on2" cx="592.0" cy="120" r="20" fill="#7C3AED" opacity="0"/>
<text class="num" x="592.0" y="126" text-anchor="middle" fill="#6B6680">3</text>
<text class="num on2" x="592.0" y="126" text-anchor="middle" fill="#FFFFFF" opacity="0">3</text>
<text class="st" x="592.0" y="200" text-anchor="middle">Read every word</text>
<text class="sd" x="592.0" y="230" text-anchor="middle">Both sides captioned,</text>
<text class="sd" x="592.0" y="251" text-anchor="middle">times pulled out for you</text>
<rect x="710.0" y="160" width="196" height="136" rx="18" fill="#FFFFFF" stroke="#E6E1F2" filter="url(#sh)"/>
<rect class="on3" x="710.0" y="160" width="196" height="136" rx="18" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2" opacity="0"/>
<circle cx="808.0" cy="120" r="20" fill="#FFFFFF" stroke="#E6E1F2" stroke-width="2"/>
<circle class="on3" cx="808.0" cy="120" r="20" fill="#7C3AED" opacity="0"/>
<text class="num" x="808.0" y="126" text-anchor="middle" fill="#6B6680">4</text>
<text class="num on3" x="808.0" y="126" text-anchor="middle" fill="#FFFFFF" opacity="0">4</text>
<text class="st" x="808.0" y="200" text-anchor="middle">Ishara handles it</text>
<text class="sd" x="808.0" y="230" text-anchor="middle">Each reply waits 2 s</text>
<text class="sd" x="808.0" y="251" text-anchor="middle">for you, then it is said</text>
<rect x="926.0" y="160" width="196" height="136" rx="18" fill="#FFFFFF" stroke="#E6E1F2" filter="url(#sh)"/>
<rect class="on4" x="926.0" y="160" width="196" height="136" rx="18" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2" opacity="0"/>
<circle cx="1024.0" cy="120" r="20" fill="#FFFFFF" stroke="#E6E1F2" stroke-width="2"/>
<circle class="on4" cx="1024.0" cy="120" r="20" fill="#7C3AED" opacity="0"/>
<text class="num" x="1024.0" y="126" text-anchor="middle" fill="#6B6680">5</text>
<text class="num on4" x="1024.0" y="126" text-anchor="middle" fill="#FFFFFF" opacity="0">5</text>
<text class="st" x="1024.0" y="200" text-anchor="middle">Step in any time</text>
<text class="sd" x="1024.0" y="230" text-anchor="middle">Tap, type or sign; polished</text>
<text class="sd" x="1024.0" y="251" text-anchor="middle">and fact-checked, then said</text>
<rect x="1142.0" y="160" width="196" height="136" rx="18" fill="#FFFFFF" stroke="#E6E1F2" filter="url(#sh)"/>
<rect class="on5" x="1142.0" y="160" width="196" height="136" rx="18" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2" opacity="0"/>
<circle cx="1240.0" cy="120" r="20" fill="#FFFFFF" stroke="#E6E1F2" stroke-width="2"/>
<circle class="on5" cx="1240.0" cy="120" r="20" fill="#7C3AED" opacity="0"/>
<text class="num" x="1240.0" y="126" text-anchor="middle" fill="#6B6680">6</text>
<text class="num on5" x="1240.0" y="126" text-anchor="middle" fill="#FFFFFF" opacity="0">6</text>
<text class="st" x="1240.0" y="200" text-anchor="middle">The gist</text>
<text class="sd" x="1240.0" y="230" text-anchor="middle">What was agreed, quoted,</text>
<text class="sd" x="1240.0" y="251" text-anchor="middle">with any follow-ups</text>
</svg>
