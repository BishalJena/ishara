<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img">
<title>One Ishara call in six steps</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.zone{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#59636E}.title{font-size:24px;font-weight:700;fill:#1F2328}.sub{font-size:14px;fill:#59636E}.row{font-size:16px;fill:#1F2328}.chip{font-size:12.5px;font-weight:600;fill:#59636E}.lab{font-size:12.5px;font-weight:700;fill:#59636E}@keyframes prog{0%{transform:scaleX(0)}69.2%{transform:scaleX(1)}92%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.prog{transform-box:fill-box;transform-origin:left;animation:prog 13.0s linear infinite}.st{font-size:21px;font-weight:700;fill:#1F2328}.sd{font-size:15.5px;fill:#59636E}.num{font-size:17px;font-weight:700}@keyframes on0{0%,0.00%{opacity:0}1.50%,92%{opacity:1}100%{opacity:0}}.on0{animation:on0 13.0s ease-out infinite}@keyframes on1{0%,13.75%{opacity:0}15.35%,92%{opacity:1}100%{opacity:0}}.on1{animation:on1 13.0s ease-out infinite}@keyframes on2{0%,27.59%{opacity:0}29.19%,92%{opacity:1}100%{opacity:0}}.on2{animation:on2 13.0s ease-out infinite}@keyframes on3{0%,41.44%{opacity:0}43.04%,92%{opacity:1}100%{opacity:0}}.on3{animation:on3 13.0s ease-out infinite}@keyframes on4{0%,55.28%{opacity:0}56.88%,92%{opacity:1}100%{opacity:0}}.on4{animation:on4 13.0s ease-out infinite}@keyframes on5{0%,69.13%{opacity:0}70.73%,92%{opacity:1}100%{opacity:0}}.on5{animation:on5 13.0s ease-out infinite}</style>
<line x1="120" y1="80" x2="1280" y2="80" stroke="#E7E9EC" stroke-width="6" stroke-linecap="round"/>
<rect class="prog" x="120" y="77" width="1160" height="6" rx="3" fill="#8B3DFF"/>
<rect x="15.0" y="120" width="210" height="140" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<rect class="on0" x="15.0" y="120" width="210" height="140" rx="16" fill="#EFE6FF" stroke="#8B3DFF" stroke-width="2" opacity="0"/>
<circle cx="120.0" cy="80" r="20" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
<circle class="on0" cx="120.0" cy="80" r="20" fill="#8B3DFF" opacity="0"/>
<text class="num" x="120.0" y="86" text-anchor="middle" fill="#59636E">1</text>
<text class="num on0" x="120.0" y="86" text-anchor="middle" fill="#FFFFFF" opacity="0">1</text>
<text class="st" x="120.0" y="162" text-anchor="middle">Type the request</text>
<text class="sd" x="120.0" y="192" text-anchor="middle">The number, what it's about,</text>
<text class="sd" x="120.0" y="214" text-anchor="middle">and a PDF they might need</text>
<rect x="247.0" y="120" width="210" height="140" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<rect class="on1" x="247.0" y="120" width="210" height="140" rx="16" fill="#EFE6FF" stroke="#8B3DFF" stroke-width="2" opacity="0"/>
<circle cx="352.0" cy="80" r="20" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
<circle class="on1" cx="352.0" cy="80" r="20" fill="#8B3DFF" opacity="0"/>
<text class="num" x="352.0" y="86" text-anchor="middle" fill="#59636E">2</text>
<text class="num on1" x="352.0" y="86" text-anchor="middle" fill="#FFFFFF" opacity="0">2</text>
<text class="st" x="352.0" y="162" text-anchor="middle">Ishara calls</text>
<text class="sd" x="352.0" y="192" text-anchor="middle">It says who it is, then</text>
<text class="sd" x="352.0" y="214" text-anchor="middle">asks in its own words</text>
<rect x="479.0" y="120" width="210" height="140" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<rect class="on2" x="479.0" y="120" width="210" height="140" rx="16" fill="#EFE6FF" stroke="#8B3DFF" stroke-width="2" opacity="0"/>
<circle cx="584.0" cy="80" r="20" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
<circle class="on2" cx="584.0" cy="80" r="20" fill="#8B3DFF" opacity="0"/>
<text class="num" x="584.0" y="86" text-anchor="middle" fill="#59636E">3</text>
<text class="num on2" x="584.0" y="86" text-anchor="middle" fill="#FFFFFF" opacity="0">3</text>
<text class="st" x="584.0" y="162" text-anchor="middle">Read every word</text>
<text class="sd" x="584.0" y="192" text-anchor="middle">Both sides captioned,</text>
<text class="sd" x="584.0" y="214" text-anchor="middle">times pulled out for you</text>
<rect x="711.0" y="120" width="210" height="140" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<rect class="on3" x="711.0" y="120" width="210" height="140" rx="16" fill="#EFE6FF" stroke="#8B3DFF" stroke-width="2" opacity="0"/>
<circle cx="816.0" cy="80" r="20" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
<circle class="on3" cx="816.0" cy="80" r="20" fill="#8B3DFF" opacity="0"/>
<text class="num" x="816.0" y="86" text-anchor="middle" fill="#59636E">4</text>
<text class="num on3" x="816.0" y="86" text-anchor="middle" fill="#FFFFFF" opacity="0">4</text>
<text class="st" x="816.0" y="162" text-anchor="middle">Ishara handles it</text>
<text class="sd" x="816.0" y="192" text-anchor="middle">Each reply waits 2 s</text>
<text class="sd" x="816.0" y="214" text-anchor="middle">for you, then it is said</text>
<rect x="943.0" y="120" width="210" height="140" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<rect class="on4" x="943.0" y="120" width="210" height="140" rx="16" fill="#EFE6FF" stroke="#8B3DFF" stroke-width="2" opacity="0"/>
<circle cx="1048.0" cy="80" r="20" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
<circle class="on4" cx="1048.0" cy="80" r="20" fill="#8B3DFF" opacity="0"/>
<text class="num" x="1048.0" y="86" text-anchor="middle" fill="#59636E">5</text>
<text class="num on4" x="1048.0" y="86" text-anchor="middle" fill="#FFFFFF" opacity="0">5</text>
<text class="st" x="1048.0" y="162" text-anchor="middle">Step in any time</text>
<text class="sd" x="1048.0" y="192" text-anchor="middle">Tap, type or sign; polished</text>
<text class="sd" x="1048.0" y="214" text-anchor="middle">and fact-checked, then said</text>
<rect x="1175.0" y="120" width="210" height="140" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<rect class="on5" x="1175.0" y="120" width="210" height="140" rx="16" fill="#EFE6FF" stroke="#8B3DFF" stroke-width="2" opacity="0"/>
<circle cx="1280.0" cy="80" r="20" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
<circle class="on5" cx="1280.0" cy="80" r="20" fill="#8B3DFF" opacity="0"/>
<text class="num" x="1280.0" y="86" text-anchor="middle" fill="#59636E">6</text>
<text class="num on5" x="1280.0" y="86" text-anchor="middle" fill="#FFFFFF" opacity="0">6</text>
<text class="st" x="1280.0" y="162" text-anchor="middle">The gist</text>
<text class="sd" x="1280.0" y="192" text-anchor="middle">What was agreed, quoted,</text>
<text class="sd" x="1280.0" y="214" text-anchor="middle">with any follow-ups</text>
</svg>
