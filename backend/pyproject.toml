[project]
name = "ishara-backend"
version = "0.1.0"
description = "Ishara call backend: app sessions, composer and Bolna custom LLM"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "mutmut>=3,<4",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "websockets>=14,<18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

# Mutation testing of the safety-critical modules (docs/TESTING.md):
#   uv run mutmut run && uv run mutmut results
[tool.mutmut]
source_paths = ["app/"]
only_mutate = [
    "app/sessions.py",
    "app/calls.py",
    "app/validator.py",
    "app/custom_llm.py",
    "app/tts.py",
    "app/contacts.py",
    "app/markers.py",
]
also_copy = ["fakes/", "tools/", "scripts/", "bolna/", "Procfile"]
